    <meta name="twitter:card" content="summary_large_image" />
    <link rel="canonical" href="%VITE_SITE_URL%/" />
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Person",
        "name": "Paras Wane",
        "jobTitle": "Full-stack and AI developer",
        "url": "%VITE_SITE_URL%/",
        "email": "mailto:paraswane15@gmail.com",
        "address": { "@type": "PostalAddress", "addressLocality": "Pune", "addressCountry": "IN" },
        "alumniOf": { "@type": "CollegeOrUniversity", "name": "Walchand College of Engineering, Sangli" },
        "worksFor": { "@type": "Organization", "name": "Grovanta", "description": "AI-powered Business Growth" },
        "knowsAbout": ["React", "Node.js", "Machine learning", "three.js", "Web development"]
      }
    </script>
    <link rel="preconnect" href="https://api.fontshare.com" crossorigin />
    <link rel="stylesheet" href="https://api.fontshare.com/v2/css?f[]=clash-display@500,600&f[]=general-sans@400,500&display=swap" />
    <script>
      // Restore theme before first paint to avoid a flash.
      document.documentElement.classList.add('js')
      try {
        var t = localStorage.getItem('pw-theme')
        if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t
        var m = localStorage.getItem('pw-reduce-motion')
        if (m === '1' || (m === null && matchMedia('(prefers-reduced-motion: reduce)').matches))
          document.documentElement.classList.add('reduce-motion')
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>
      <p style="padding:24px;font-family:sans-serif">Paras Wane — Full-stack and AI developer, founder of Grovanta.
        <a href="/resume.pdf">Resume (PDF)</a> · <a href="mailto:paraswane15@gmail.com">Email</a></p>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
